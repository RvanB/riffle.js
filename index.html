<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#202225" />
    <title>riffle.js — demo</title>
    <link rel="stylesheet" href="./demo/reader.css" />
  </head>
  <body>
    <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
      <symbol id="icon-open" viewBox="0 0 24 24"><path d="M3 8V5h7l2 3h9v11H3V8Zm0 3h18"/></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 7h7m4 0h5M4 17h3m4 0h9"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
      <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" rx="1"/><rect x="14" y="4" width="7" height="16" rx="1"/></symbol>
      <symbol id="icon-focus" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
      <symbol id="icon-left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
      <symbol id="icon-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    </defs></svg>
    <header id="toolbar" aria-label="Reader controls">
      <span class="demo-title">riffle.js <span>demo</span></span>
      <button data-open-file><svg class="icon"><use href="#icon-open"/></svg>Open file</button>
      <div id="document-info" hidden><span id="document-name"></span><span id="document-meta"></span></div>
      <nav class="header-actions" aria-label="Document actions">
        <button id="appearance-toggle" popovertarget="paper-settings" aria-label="Paper settings" title="Paper settings"><svg class="icon"><use href="#icon-settings"/></svg>Paper settings</button>
        <a class="doc-link" href="./docs/">Docs</a>
      </nav>
      <input type="file" id="file-input" accept="application/pdf,.pdf,image/*" multiple hidden />
    </header>
    <section id="paper-settings" popover aria-labelledby="appearance-title">
      <div class="panel-heading"><h2 id="appearance-title">Paper settings</h2><button class="icon-button" popovertarget="paper-settings" popovertargetaction="hide" aria-label="Close paper settings"><svg class="icon"><use href="#icon-close"/></svg></button></div>
      <label class="field-label" for="paper-preset">Paper tone</label>
      <select id="paper-preset"></select>
      <div class="field-heading"><label class="field-label" for="show-through">Show-through</label><output id="show-through-value" for="show-through">10%</output></div>
      <input id="show-through" type="range" min="0" max="1" step="0.01" value="0.1" aria-describedby="show-through-help" />
      <p class="field-help" id="show-through-help">Visibility of content on the reverse side of a page.</p>
      <div class="range-labels" aria-hidden="true"><span>Opaque</span><span>Translucent</span></div>
    </section>
    <button id="show-toolbar" class="floating-control" hidden><svg class="icon"><use href="#icon-focus"/></svg>Exit focus <kbd>Esc</kbd></button>
    <main id="viewport" tabindex="-1" aria-label="Book reader" aria-describedby="gesture-hint">
      <div id="stage" hidden></div>
      <section id="empty-state" aria-labelledby="empty-title">
        <h1 id="empty-title">Open a PDF or images</h1>
        <p>Drop files here, or use <button class="text-button" data-open-file>Open file</button> to choose them.</p>
      </section>
      <div id="loading-status" class="status-toast" role="status" hidden><span id="status-message"></span><button id="dismiss-status" class="icon-button" aria-label="Dismiss message" hidden><svg class="icon"><use href="#icon-close"/></svg></button></div>
    </main>
    <div id="drop-overlay" hidden><svg class="icon"><use href="#icon-open"/></svg><strong>Drop one PDF or a set of images</strong></div>
    <footer id="reader-footer">
      <div id="strip-container" hidden aria-label="Page thumbnails"></div>
      <div class="reader-controls">
        <div class="view-controls"><button id="toggle-strip" aria-label="Thumbnails" title="Show or hide thumbnails" aria-controls="strip-container" aria-expanded="false"><svg class="icon"><use href="#icon-grid"/></svg><span class="button-label">Thumbnails</span></button><button id="hide-toolbar" aria-label="Enter focus mode" title="Focus mode"><svg class="icon"><use href="#icon-focus"/></svg><span class="button-label">Focus</span></button></div>
        <div id="page-jump"><button id="previous-page" class="icon-button" aria-label="Previous spread" title="Previous spread (←)"><svg class="icon"><use href="#icon-left"/></svg></button><label for="page-input">Page</label><input id="page-input" type="number" min="1" value="" inputmode="numeric" aria-label="Go to page" /><span id="spread-readout" aria-live="polite">of —</span><button id="next-page" class="icon-button" aria-label="Next spread" title="Next spread (→)"><svg class="icon"><use href="#icon-right"/></svg></button></div>
        <div class="zoom-controls"><button id="zoom-out" class="icon-button" aria-label="Zoom out">−</button><button id="zoom-reset" title="Fit spread to screen">Fit</button><button id="zoom-in" class="icon-button" aria-label="Zoom in">+</button></div>
      </div>
      <p id="gesture-hint">Arrow keys to turn pages · Pinch to zoom</p>
    </footer>
    <script type="module" src="./demo/reader.js"></script>
  </body>
</html>
